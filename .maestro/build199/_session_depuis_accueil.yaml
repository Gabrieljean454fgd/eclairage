# Sous-parcours build 199 : depuis l'Accueil déjà ouvert (SANS clearState ni relance, pour garder la synchro en cours),
# crée un site sans OSM et ouvre une session. Mêmes étapes que scenario1_1_creer_releve.yaml.
appId: app.lumisite.android
---
- tapOn: { id: "accueil_nouveau_releve" }
- tapOn: { id: "nouveau_site_nom_du_site" }
- inputText: "Maestro bureau"
- hideKeyboard
# Nouveau site : la carte occupe le haut de l'écran (58 %) ; on fait défiler le formulaire en glissant DANS le formulaire.
- repeat:
    while: { notVisible: { id: "nouveau_site_latitude_wgs84" } }
    times: 12
    commands:
      - swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- tapOn: { id: "nouveau_site_latitude_wgs84" }
- inputText: "43.6045"
- hideKeyboard
# Nouveau site : la carte occupe le haut de l'écran (58 %) ; on fait défiler le formulaire en glissant DANS le formulaire.
- repeat:
    while: { notVisible: { id: "nouveau_site_longitude" } }
    times: 12
    commands:
      - swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- tapOn: { id: "nouveau_site_longitude" }
- inputText: "1.4440"
- hideKeyboard
# Nouveau site : la carte occupe le haut de l'écran (58 %) ; on fait défiler le formulaire en glissant DANS le formulaire.
- repeat:
    while: { notVisible: { id: "nouveau_site_utiliser_ces_coordonnees" } }
    times: 12
    commands:
      - swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- tapOn: { id: "nouveau_site_utiliser_ces_coordonnees" }
# Défilement dans le bas de l'écran (jamais au centre : carte / caméra).
- repeat:
    while: { notVisible: "Origine : 43.6045000, 1.4440000 \\(COORDINATES\\)" }
    times: 12
    commands:
      - swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- assertVisible: "Origine : 43.6045000, 1.4440000 \\(COORDINATES\\)"
# Nouveau site : la carte occupe le haut de l'écran (58 %) ; on fait défiler le formulaire en glissant DANS le formulaire.
- repeat:
    while: { notVisible: { id: "nouveau_site_creer" } }
    times: 12
    commands:
      - swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- tapOn: { id: "nouveau_site_creer" }
# Site : le titre complet est affiché (colonne unique en portrait, jamais coupé lettre par lettre).
- assertVisible: { id: "site_titre", text: "Maestro bureau" }
- tapOn: { id: "site_nouvelle_session_terrain" }
- assertVisible: { id: "session_terminer_la_session" }
