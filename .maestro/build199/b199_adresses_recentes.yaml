# Retour terrain build 199 (17/11), point 3 — SPÉCIFICATION. Une adresse validée dans Nouveau site est gardée localement
# (même sans réseau ni résultat) et proposée dès qu'on retape le début, avant toute recherche en ligne.
# Le rectangle de sélection (point 4, « impeccable ») n'est pas touché : v176_nouveau_site_rectangle.yaml doit rester vert.
appId: app.lumisite.android
name: "build199 Nouveau site - adresses récentes locales"
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible: { id: "accueil_nouveau_releve" }
    timeout: 90000
# 1) « Rechercher » (action Entrée du clavier, ImeAction.Search) enregistre l'adresse tapée, sans choisir de résultat.
- tapOn: { id: "accueil_nouveau_releve" }
- tapOn: { id: "nouveau_site_adresse_lieu" }
- inputText: "39 rue Dupont Toulouse"
- pressKey: Enter
- hideKeyboard
- back
- extendedWaitUntil:
    visible: { id: "accueil_nouveau_releve" }
    timeout: 15000
# 2) Réouverture : la suggestion locale apparaît dès les premières lettres, avant toute recherche en ligne.
- tapOn: { id: "accueil_nouveau_releve" }
- tapOn: { id: "nouveau_site_adresse_lieu" }
- inputText: "39 rue D"
- extendedWaitUntil:
    visible: { id: "nouveau_site_adresse_recente_1", text: "39 rue Dupont Toulouse.*" }
    timeout: 10000
- tapOn: { id: "nouveau_site_adresse_recente_1" }
- takeScreenshot: maestro-out/captures/b199_adresses_recentes
