# Retour terrain build 199 (17/11), points 2d et 2e — SPÉCIFICATION.
# - Les traits AR sont désormais les intersections de plans détectés (plinthe sol∩mur, angle mur∩mur,
#   mur∩plafond), bornés aux polygones et colorés par type ; les polygones bruts blancs ne s'affichent plus
#   que via Réglages > Diagnostic (« Polygones ARCore bruts », tag reglages_ar_polygones_bruts).
# - La visée SOL ignore le mobilier (plans horizontaux 0,3–2,0 m au-dessus du sol) et les plans < 0,25 m² :
#   filtre pur PlaneFilter branché avant Aim.resolve — vérifiable en tests JVM et au téléphone seulement.
# En CI l'AR est simulé : on vérifie les commandes sous la caméra et l'option de diagnostic, pas le tracé.
appId: app.lumisite.android
name: "build199 AR - arêtes de plans, mobilier ignoré"
---
- runFlow: ../scenario1_1_creer_releve.yaml
- assertVisible: { id: "session_ar_contours" }
- assertVisible: { id: "session_ar_support_auto", text: "Visée : (sol|mur|plafond) \\(auto\\).*" }
- assertNotVisible: { id: "session_ar_surface_tous" }
- tapOn: { id: "session_terminer_la_session" }
- extendedWaitUntil:
    visible: { id: "site_retour" }
    timeout: 30000
- tapOn: { id: "site_retour" }
- extendedWaitUntil:
    visible: { id: "accueil_reglages" }
    timeout: 30000
- tapOn: { id: "accueil_reglages" }
# Défilement dans le bas de l'écran (jamais au centre : carte / caméra).
- repeat:
    while: { notVisible: { id: "reglages_ar_polygones_bruts" } }
    times: 12
    commands:
      - swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- assertVisible: "Polygones ARCore bruts en AR"
- tapOn: { id: "reglages_ar_polygones_bruts" }
- tapOn: { id: "reglages_ar_polygones_bruts" }
- takeScreenshot: maestro-out/captures/b199_ar_aretes
