# Retour terrain build 199 (17/11), points 5 et 6 — SPÉCIFICATION. Sous la caméra (en-tête AR simulé en CI) :
# - plus de puces Tous / Sol / Mur / Plafond : une ligne « Visée : … (auto) » déduite de l'inclinaison ;
# - l'interrupteur « Contours » et la torche restent visibles quel que soit l'onglet ouvert (ils ne « sautent » plus) ;
# - le bloc caméra garde la même hauteur entre Aucun / Calibrer / Relevé (pas de bascule 4:3 → 2:1 pendant la visée).
appId: app.lumisite.android
name: "build199 AR : commandes stables, support automatique"
---
- runFlow: ../scenario1_1_creer_releve.yaml
- assertNotVisible: { id: "session_ar_surface_tous" }
- assertNotVisible: { id: "session_ar_surface_plafond" }
- assertVisible: { id: "session_ar_support_auto", text: "Visée : (sol|mur|plafond) \\(auto\\).*" }
- assertVisible: { id: "session_ar_contours" }
- tapOn: { id: "session_calibrer" }
- assertVisible: { id: "session_ar_contours" }
- assertVisible: { id: "session_ar_support_auto" }
- tapOn: { id: "session_releve" }
- assertVisible: { id: "session_ar_contours" }
- assertVisible: { id: "session_ar_torche_oui" }
- tapOn: { id: "session_synchro" }
- assertVisible: { id: "session_ar_contours" }
- tapOn: { id: "session_synchro" }
- assertVisible: { id: "session_ar_contours" }
- takeScreenshot: maestro-out/captures/b199_ar_menus_stables
