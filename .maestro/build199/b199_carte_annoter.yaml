# Retour terrain build 199 (17/11), points 7 et 9 — SPÉCIFICATION. En Annoter, la caméra se replie (bande ou masquée)
# et la carte prend au moins la moitié de l'écran ; un bouton « Carte plein écran » existe dans tous les onglets.
appId: app.lumisite.android
name: "build199 carte : assez grande pour Annoter"
---
- runFlow: ../scenario1_1_creer_releve.yaml
- tapOn: { id: "session_annoter" }
- assertVisible: { id: "session_carte" }
- assertVisible: { id: "session_camera_repliee" }
- assertVisible: { id: "session_carte_plein_ecran" }
- tapOn: { id: "session_carte_plein_ecran" }
- assertNotVisible: { id: "session_bloc_ar" }
- assertVisible: { id: "session_barre_actions" }
- tapOn: { id: "session_carte_plein_ecran" }
- assertVisible: { id: "session_bloc_ar" }
- takeScreenshot: maestro-out/captures/b199_carte_annoter
