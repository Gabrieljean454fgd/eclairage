# Retour terrain build 199 (17/11), point 2 — SPÉCIFICATION (échoue tant que le paquet v176g n'est pas livré).
# Accueil > Sync > Saisie (maître) puis Retour : la synchro reste active ; Session > Synchro montre le MÊME état
# (rôle, bandeau de connexion, journal Nearby) au lieu du seul bouton « Synchroniser ».
# Hors CI racine (.maestro/build199/) ; efface les données (clearState via le sous-parcours) : ne pas lancer sur le Pixel
# sans sauvegarde run-as + tar préalable.
appId: app.lumisite.android
name: "build199 synchro - état partagé Accueil - Sync - Session - Synchro"
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible: { id: "accueil_synchro" }
    timeout: 90000
- tapOn: { id: "accueil_synchro" }
- tapOn: { id: "synchro_mode_maitre" }
- tapOn: { text: "(?i)autoriser|allow|while using the app|lors de l'utilisation", optional: true }
- extendedWaitUntil:
    visible: { id: "synchro_mode_actif" }
    timeout: 15000
# Nouveau : bandeau de connexion unique (SyncDisplay.masterBanner), orange « Recherche d'esclaves… » sans esclave.
- assertVisible: { id: "synchro_bandeau_connexion", text: "Recherche d'esclaves.*" }
- scrollUntilVisible: { element: { id: "synchro_retour" }, direction: DOWN }
- tapOn: { id: "synchro_retour" }
# Accueil : un indicateur montre que la synchro maître tourne toujours.
- assertVisible: { id: "accueil_synchro_active", text: ".*maître.*" }
# Ouvre un site et une session (sans clearState cette fois : la synchro doit survivre).
- runFlow: _session_depuis_accueil.yaml
- tapOn: { id: "session_synchro" }
- assertVisible: { id: "session_synchro_etat", text: ".*Saisie \\(maître\\).*" }
- assertVisible: { id: "synchro_bandeau_connexion" }
- assertVisible: { id: "session_synchro_journal" }
- assertVisible: ".*rôle : Saisie \\(maître\\)"
- assertVisible: { id: "session_synchro_synchroniser", text: "Lancer un top de synchro.*" }
- takeScreenshot: maestro-out/captures/b199_sync_etat_partage
