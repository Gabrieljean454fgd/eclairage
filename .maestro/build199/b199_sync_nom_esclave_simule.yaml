# Retour terrain build 199 (17/11), point 1 — SPÉCIFICATION. Le maître doit afficher le NOM de l'esclave et « connecté »
# en vert. Deux téléphones sont impossibles sur l'émulateur : l'APK debug accepte un esclave simulé
# (adb shell settings put global lumisite_simuler_esclave "Xiaomi 13T Pro"), injecté dans MasterMesh comme un vrai
# pair (onConnecting + onConnected + Hello + pongs automatiques), sans radio.
# Avant le flow : adb shell settings put global lumisite_simuler_esclave "Xiaomi 13T Pro"
# Après le flow  : adb shell settings delete global lumisite_simuler_esclave
# (le réglage global survit à clearState : les autres flows doivent le trouver absent).
appId: app.lumisite.android
name: "build199 synchro : nom de l'esclave visible sur le maître (esclave simulé)"
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible: { id: "accueil_synchro" }
    timeout: 90000
- tapOn: { id: "accueil_synchro" }
- tapOn: { id: "synchro_mode_maitre" }
- tapOn: { text: "(?i)autoriser|allow|while using the app|lors de l'utilisation", optional: true }
- extendedWaitUntil:
    visible: { id: "synchro_bandeau_connexion", text: "Connecté : Xiaomi 13T Pro.*" }
    timeout: 20000
- assertVisible: { id: "synchro_esclave_1", text: ".*Xiaomi 13T Pro.*" }
- assertVisible: { id: "synchro_esclave_1_connexion", text: "Connexion : connecté" }
# Le décalage brut entre horloges monotones (« 1001033936,0 ms ») n'est plus affiché, seulement l'incertitude.
- assertNotVisible: ".*decalage [0-9]{7,}.*"
- assertNotVisible: ".*décalage [0-9]{7,}.*"
# « Dernier message : il y a N s » doit avancer seul (rafraîchi chaque seconde) : on vérifie qu'il reste < 10 s.
- assertVisible: { id: "synchro_esclave_1_dernier", text: "Dernier message : il y a [0-9] s.*" }
- takeScreenshot: maestro-out/captures/b199_sync_nom_esclave
