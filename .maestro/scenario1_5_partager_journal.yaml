# Scénario 1 : Accueil > « Réglages » > Journal > « Partager le journal » (ouvre le partage Android).
appId: app.lumisite.android
name: "Scénario 1.5 — Réglages, Journal, Partager le journal"
---
- launchApp:
    permissions: { all: allow }
- tapOn: { id: "accueil_reglages" }
# Réglages : les sections Synchro et Relevé (build 248) repoussent « Partager le journal » sous la ligne de flottaison.
- scrollUntilVisible: { element: { id: "reglages_journal_partager" } }
- tapOn: { id: "reglages_journal_partager" }
- assertVisible: "(?i).*partager le journal.*|.*share.*"
- back
