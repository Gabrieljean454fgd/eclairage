# Prompt v4 2.4 / D3 : Session > « Calibrer » > « Valider le point » deux fois → Session > Calibrer > tableau à 2 lignes →
# « Supprimer » sur la ligne 1 → 1 ligne. L'émulateur n'a pas ARCore : l'argument de lancement simuler_pose_ar (APK de débogage
# uniquement) fournit des poses AR synthétiques. Les défilements se font par glissement dans le panneau (au centre de l'écran, un
# glissement déplacerait la carte). Ce parcours vérifie l'interface et le tableau, pas la précision du suivi AR réel.
appId: app.lumisite.android
name: "Session calibrage multipoints"
---
- launchApp:
    clearState: true
    permissions: { all: allow }
    arguments:
      simuler_pose_ar: true
- extendedWaitUntil:
    visible: { id: "accueil_nouveau_releve" }
    timeout: 90000
- tapOn: { id: "accueil_nouveau_releve" }
- tapOn: { id: "nouveau_site_nom_du_site" }
- inputText: "Maestro calibrage"
- hideKeyboard
- scrollUntilVisible: { element: { id: "nouveau_site_latitude_wgs84" } }
- tapOn: { id: "nouveau_site_latitude_wgs84" }
- inputText: "43.6045"
- hideKeyboard
- scrollUntilVisible: { element: { id: "nouveau_site_longitude" } }
- tapOn: { id: "nouveau_site_longitude" }
- inputText: "1.4440"
- hideKeyboard
- scrollUntilVisible: { element: { id: "nouveau_site_utiliser_ces_coordonnees" } }
- tapOn: { id: "nouveau_site_utiliser_ces_coordonnees" }
- scrollUntilVisible: { element: { id: "nouveau_site_creer" } }
- tapOn: { id: "nouveau_site_creer" }
- tapOn: { id: "site_nouvelle_session_terrain" }
- assertVisible: { id: "session_terminer_la_session" }
- tapOn: { id: "session_calibrer" }
- tapOn: { id: "session_point_a_la_croix" }
- tapOn: { id: "session_calibrer_cap_de_visee" }
- inputText: "0"
- hideKeyboard
- tapOn: { id: "session_calibrer_valider_la_calibration" }
- swipe: { start: "50%,74%", end: "50%,56%", duration: 600 }
- assertVisible: { id: "session_calibrer_ligne_1" }
- repeat:
    while: { notVisible: { id: "session_calibrer_valider_la_calibration" } }
    times: 8
    commands:
      - swipe: { start: "50%,74%", end: "50%,86%", duration: 600 }
# Marge : le bouton doit être entièrement sous la carte, sinon l'appui tombe sur la carte.
- swipe: { start: "50%,74%", end: "50%,86%", duration: 600 }
# 2e point carte = position actuelle du téléphone (Centrer / Suivre puis Point à la croix), calibrée par le point 1 + cap, choisie juste avant Valider (le téléphone simulé avance de 0,6 m/s) :
# correspondance cohérente avec les poses simulées. Un point arbitraire de la carte est refusé comme contradictoire (paquet v6).
- tapOn: { id: "session_trajectoire_estimee_vert_non_gar" }
- tapOn: { id: "session_point_a_la_croix" }
- tapOn: { id: "session_calibrer_valider_la_calibration" }
# Le dernier message est fixé au-dessus de la barre d'actions (bas de l'écran) : on glisse plus haut, dans le panneau, jusqu'à la ligne 2.
- repeat:
    while: { notVisible: { id: "session_calibrer_ligne_2" } }
    times: 8
    commands:
      - swipe: { start: "50%,80%", end: "50%,74%", duration: 600 }
- assertVisible: { id: "session_calibrer_ligne_2" }
- repeat:
    while: { notVisible: { id: "session_calibrer_ligne_1" } }
    times: 8
    commands:
      - swipe: { start: "50%,74%", end: "50%,80%", duration: 600 }
- assertVisible: { id: "session_calibrer_ligne_1" }
- tapOn: { id: "session_calibrer_supprimer_1" }
- assertVisible: { id: "session_calibrer_ligne_1" }
- assertNotVisible: { id: "session_calibrer_ligne_2" }
