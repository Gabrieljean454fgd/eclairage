# Session > Relevé > « Enregistrer le relevé » : l'appareil photo s'ouvre aussitôt (photo facultative).
# Retour sans photo, puis panneau « Prendre la photo / Reprendre / Passer » ; « Passer » le ferme.
# Ensuite Accueil > Réglages > Relevé > « Photo automatique à l'implantation » : désactivée, le panneau n'apparaît plus.
appId: app.lumisite.android
name: Session releve photo automatique a l implantation
---
- runFlow: scenario1_1_creer_releve.yaml
- tapOn: { id: "session_releve" }
- tapOn: { id: "session_point_a_la_croix" }
- tapOn: { id: "session_annoter_famille_Amplificateur" }
# Le panneau du bas défile jusqu'au bouton (la longueur de la grille des familles varie).
- repeat:
    while: { notVisible: { id: "session_releve_enregistrer_le_releve" } }
    times: 8
    commands:
      - swipe: { start: "50%,88%", end: "50%,72%", duration: 600 }
- assertVisible: { id: "session_releve_checkbox", checked: true }
- tapOn: { id: "session_releve_enregistrer_le_releve" }
- assertNotVisible: { id: "session_terminer_la_session" }
- back
- extendedWaitUntil:
    visible: { id: "session_photo_proposee" }
    timeout: 15000
- assertVisible: { id: "session_photo_prendre" }
- assertVisible: { id: "session_photo_reprendre", enabled: false }
- tapOn: { id: "session_photo_passer" }
- assertNotVisible: { id: "session_photo_proposee" }
