# Décision A du 09/11 : Session > « Calibrer » : 2 points cohérents (Point à la croix, cap 0°, puis position du téléphone),
# puis un 3e point touché loin sur la carte (≈ 47 m alors que le téléphone simulé n'a bougé que de quelques mètres) :
# refusé comme correspondance contradictoire (refus par défaut conservé). « Recaler quand même » > « Cause : perte de suivi
# ARCore » : le point est enregistré, marqué « forcé » dans le tableau, les points 1 et 2 sont conservés.
# Poses AR simulées (simuler_pose_ar, APK de débogage) : vérifie l'interface et le journal, pas un vrai saut ARCore.
appId: app.lumisite.android
name: "Calibrage recaler quand meme"
---
- launchApp:
    clearState: true
    permissions: { all: allow }
    arguments:
      simuler_pose_ar: true
- extendedWaitUntil:
    visible: { id: "accueil_nouveau_releve" }
    timeout: 90000
- tapOn: { id: "accueil_nouveau_releve" }
- tapOn: { id: "nouveau_site_nom_du_site" }
- inputText: "Maestro forcer"
- hideKeyboard
- scrollUntilVisible: { element: { id: "nouveau_site_latitude_wgs84" } }
- tapOn: { id: "nouveau_site_latitude_wgs84" }
- inputText: "43.6045"
- hideKeyboard
- scrollUntilVisible: { element: { id: "nouveau_site_longitude" } }
- tapOn: { id: "nouveau_site_longitude" }
- inputText: "1.4440"
- hideKeyboard
- scrollUntilVisible: { element: { id: "nouveau_site_utiliser_ces_coordonnees" } }
- tapOn: { id: "nouveau_site_utiliser_ces_coordonnees" }
- scrollUntilVisible: { element: { id: "nouveau_site_creer" } }
- tapOn: { id: "nouveau_site_creer" }
- tapOn: { id: "site_nouvelle_session_terrain" }
- assertVisible: { id: "session_terminer_la_session" }
- runFlow: maj/v6_calibrer_2_points.yaml
- repeat:
    while: { notVisible: { id: "session_calibrer_valider_la_calibration" } }
    times: 8
    commands:
      - swipe: { start: "50%,74%", end: "50%,86%", duration: 600 }
# Marge : le bouton doit être entièrement sous la carte, sinon l'appui tombe sur la carte.
- swipe: { start: "50%,74%", end: "50%,86%", duration: 600 }
- tapOn: { point: "30%,50%" }
- tapOn: { id: "session_calibrer_valider_la_calibration" }
- extendedWaitUntil:
    visible: ".*Correspondance contradictoire.*"
    timeout: 10000
- assertNotVisible: { id: "session_calibrer_ligne_3" }
- repeat:
    while: { notVisible: { id: "session_calibrer_recaler_quand_meme" } }
    times: 6
    commands:
      - swipe: { start: "50%,74%", end: "50%,62%", duration: 600 }
- tapOn: { id: "session_calibrer_recaler_quand_meme" }
- assertVisible: { id: "session_forcer_explication" }
- tapOn: { id: "session_forcer_cause_perte_suivi" }
- extendedWaitUntil:
    visible: ".*Point forcé enregistré \\(cause : perte de suivi ARCore.*"
    timeout: 10000
- repeat:
    while: { notVisible: { id: "session_calibrer_ligne_3" } }
    times: 8
    commands:
      - swipe: { start: "50%,74%", end: "50%,62%", duration: 600 }
- assertVisible: { id: "session_calibrer_ligne_3" }
- assertVisible: { text: "3 · .* · forcé", childOf: { id: "session_calibrer_ligne_3" } }
- assertNotVisible: { id: "session_calibrer_recaler_quand_meme" }
- repeat:
    while: { notVisible: { id: "session_calibrer_ligne_1" } }
    times: 8
    commands:
      - swipe: { start: "50%,74%", end: "50%,86%", duration: 600 }
- assertVisible: { id: "session_calibrer_ligne_1" }
- assertVisible: { id: "session_calibrer_ligne_2" }
