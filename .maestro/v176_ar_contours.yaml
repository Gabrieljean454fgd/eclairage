# v176c / v176g § 2a : interrupteur « Contours » (arêtes de la pièce par intersections de plans), compteurs de plans sol / murs / plafond
# échantillonnés à 2 Hz. Plus de sélecteur de surface : le support visé se déduit de l'inclinaison (« Visée : mur (auto) »).
# Sur émulateur sans ARCore : compteurs à 0 ; le tracé lui-même (arêtes, drapeaux, symbole du luminaire) se vérifie au téléphone.
appId: app.lumisite.android
name: "v176c contours AR"
---
- runFlow: scenario1_1_creer_releve.yaml
- assertVisible: "Plans : sol  0 · murs  0 · plafond  0"
- assertVisible: { id: "session_ar_support_auto", text: "Visée : (sol|mur|plafond) \\(auto\\)" }
- assertNotVisible: { id: "session_ar_surface_tous" }
- assertNotVisible: { id: "session_ar_surface_plafond" }
- assertVisible: "Contours : affichés"
- tapOn: { id: "session_ar_contours" }
- assertVisible: "Contours : masqués"
- tapOn: { id: "session_ar_contours" }
- assertVisible: "Contours : affichés"
- takeScreenshot: maestro-out/captures/v176_ar_contours
