# v176c (décision 3) : Session > caméra sur toute la largeur de l'écran (4:3), visée / plans / torche / mesure en dessous,
# carte et barre d'actions toujours visibles. session_ar_camera = bloc caméra réel (ARCore, Pixel) ou simulé (APK debug,
# lumisite_simuler_entete_ar = 1, émulateur sans ARCore) : le flow ne dépend plus du mode simulé.
appId: app.lumisite.android
name: "v176c caméra pleine largeur"
---
- runFlow: scenario1_1_creer_releve.yaml
- assertVisible: { id: "session_ar_camera" }
- assertVisible: "Caméra pleine largeur"
- assertVisible: { id: "session_ar_plans" }
- assertVisible: { id: "session_ar_torche_oui" }
- assertVisible: { id: "session_carte" }
- assertVisible: { id: "session_barre_actions" }
- assertVisible: { id: "session_releve" }
- takeScreenshot: maestro-out/captures/v176_ar_pleine_largeur
