# v176e E1 — Session > Relevé : recherche sans accents (« encastre » trouve Downlight), favoris (épingler).
appId: app.lumisite.android
name: "v176e catalogue recherche"
---
- runFlow: scenario1_1_creer_releve.yaml
- tapOn: { id: "session_releve" }
- tapOn: { id: "session_point_a_la_croix" }
- tapOn: { id: "session_catalogue_recherche" }
- inputText: "encastre"
- hideKeyboard
- assertVisible: { id: "session_catalogue_resultats", text: "\\d+ résultat\\(s\\)" }
- tapOn: { id: "session_annoter_famille_LS_ECLAIRAGE_DOWNLIGHT" }
- assertVisible: { id: "session_catalogue_choisi", text: "Choisi : Éclairage › Encastré › Downlight encastre au plafond" }
- takeScreenshot: v176_catalogue_recherche
- eraseText: 20
- hideKeyboard
- tapOn: { id: "session_annoter_famille_desepingler" }
- assertVisible: { id: "session_annoter_famille_epin_LS_ECLAIRAGE_DOWNLIGHT" }
