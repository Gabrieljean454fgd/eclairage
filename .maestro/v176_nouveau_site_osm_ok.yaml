# v176a A2 : Nouveau site > « Autour de l'origine » > « Récupérer » : bandeau vert « Données OSM récupérées : N objets »
# au-dessus de « Créer le site » (orange pendant le chargement, rouge si échec). Nécessite le réseau (API OSM).
appId: app.lumisite.android
name: "v176a Nouveau site OSM recupere"
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible: { id: "accueil_nouveau_releve" }
    timeout: 90000
- tapOn: { id: "accueil_nouveau_releve" }
- tapOn: { id: "nouveau_site_nom_du_site" }
- inputText: "Maestro OSM"
- hideKeyboard
# Nouveau site : la carte occupe le haut de l'écran (58 %) ; on fait défiler le formulaire en glissant DANS le formulaire.
- repeat:
    while: { notVisible: { id: "nouveau_site_latitude_wgs84" } }
    times: 12
    commands:
      - swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- tapOn: { id: "nouveau_site_latitude_wgs84" }
- inputText: "43.6045"
- hideKeyboard
# Nouveau site : la carte occupe le haut de l'écran (58 %) ; on fait défiler le formulaire en glissant DANS le formulaire.
- repeat:
    while: { notVisible: { id: "nouveau_site_longitude" } }
    times: 12
    commands:
      - swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- tapOn: { id: "nouveau_site_longitude" }
- inputText: "1.4440"
- hideKeyboard
# Nouveau site : la carte occupe le haut de l'écran (58 %) ; on fait défiler le formulaire en glissant DANS le formulaire.
- repeat:
    while: { notVisible: { id: "nouveau_site_utiliser_ces_coordonnees" } }
    times: 12
    commands:
      - swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- tapOn: { id: "nouveau_site_utiliser_ces_coordonnees" }
- assertNotVisible: { id: "nouveau_site_osm_etat" }
# Nouveau site : la carte occupe le haut de l'écran (58 %) ; on fait défiler le formulaire en glissant DANS le formulaire.
- repeat:
    while: { notVisible: { id: "nouveau_site_autour_de_l_origine" } }
    times: 12
    commands:
      - swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- tapOn: { id: "nouveau_site_autour_de_l_origine" }
# Retour terrain 22/11 : plus de bouton « Récupérer », les contours OSM partent seuls une fois le rectangle posé.
# La réponse OSM allonge le formulaire : descendre jusqu'à ce que le bandeau vert soit visible (bas du formulaire).
- scrollUntilVisible:
    element: { id: "nouveau_site_osm_etat", text: "Données OSM récupérées : [0-9]+ objets" }
    timeout: 90000
# Nouveau site : la carte occupe le haut de l'écran (58 %) ; on fait défiler le formulaire en glissant DANS le formulaire.
- repeat:
    while: { notVisible: { id: "nouveau_site_creer" } }
    times: 12
    commands:
      - swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- assertVisible: { id: "nouveau_site_creer" }
- assertVisible: "Créer le site"
- takeScreenshot: maestro-out/captures/v176_nouveau_site_osm_ok
