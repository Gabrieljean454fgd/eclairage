# v176a-bis : Accueil > Nouveau relevé > « Tracer rectangle » (orange quand actif) : tracer deux rectangles, désactiver,
# déplacer la carte (aucun rectangle ajouté), réactiver, tracer un 3e rectangle, l'étirer par un coin, le déplacer,
# le supprimer, puis « Créer ». Le site garde les rectangles (union ; bbox = enveloppe). Nécessite le réseau (API OSM).
appId: app.lumisite.android
name: "v176a-bis Nouveau site rectangles"
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible: { id: "accueil_nouveau_releve" }
    timeout: 90000
- tapOn: { id: "accueil_nouveau_releve" }
- tapOn: { id: "nouveau_site_nom_du_site" }
- inputText: "Maestro rectangles"
- hideKeyboard
- scrollUntilVisible: { element: { id: "nouveau_site_latitude_wgs84" } }
- tapOn: { id: "nouveau_site_latitude_wgs84" }
- inputText: "43.6045"
- hideKeyboard
- scrollUntilVisible: { element: { id: "nouveau_site_longitude" } }
- tapOn: { id: "nouveau_site_longitude" }
- inputText: "1.4440"
- hideKeyboard
- scrollUntilVisible: { element: { id: "nouveau_site_utiliser_ces_coordonnees" } }
- tapOn: { id: "nouveau_site_utiliser_ces_coordonnees" }
- scrollUntilVisible: { element: { id: "nouveau_site_tracer_le_rectangle" } }
- tapOn: { id: "nouveau_site_tracer_le_rectangle" }
- assertVisible: "Tracer rectangle : actif"
- scrollUntilVisible: { element: { id: "nouveau_site_recuperer" } }
- assertVisible: { id: "nouveau_site_aide_rectangle" }
# Rectangle 1 puis rectangle 2 (un doigt sur la carte, en haut de l'écran).
- swipe: { start: "12%, 18%", end: "38%, 28%", duration: 1200 }
- extendedWaitUntil:
    visible: { id: "nouveau_site_rectangles", text: "Rectangle : environ .*" }
    timeout: 5000
- swipe: { start: "60%, 20%", end: "85%, 28%", duration: 1200 }
- extendedWaitUntil:
    visible: { id: "nouveau_site_rectangles", text: "Rectangles : 2, .*" }
    timeout: 5000
- takeScreenshot: maestro-out/captures/v176_rectangle_deux
# Désactiver : un glisser déplace la carte et n'ajoute aucun rectangle.
- scrollUntilVisible: { element: { id: "nouveau_site_tracer_le_rectangle" }, direction: UP }
- tapOn: { id: "nouveau_site_tracer_le_rectangle" }
- assertVisible: "Tracer rectangle"
- scrollUntilVisible: { element: { id: "nouveau_site_recuperer" } }
- assertNotVisible: { id: "nouveau_site_aide_rectangle" }
- swipe: { start: "50%, 38%", end: "50%, 31%", duration: 1200 }
- assertVisible: { id: "nouveau_site_rectangles", text: "Rectangles : 2, .*" }
# Réactiver, tracer un 3e rectangle (sélectionné d'office), l'étirer par son coin bas-droit, le déplacer, le supprimer.
- scrollUntilVisible: { element: { id: "nouveau_site_tracer_le_rectangle" }, direction: UP }
- tapOn: { id: "nouveau_site_tracer_le_rectangle" }
- assertVisible: "Tracer rectangle : actif"
- scrollUntilVisible: { element: { id: "nouveau_site_recuperer" } }
- swipe: { start: "30%, 32%", end: "50%, 39%", duration: 1200 }
- extendedWaitUntil:
    visible: { id: "nouveau_site_rectangles", text: "Rectangles : 3, .*" }
    timeout: 5000
- assertVisible: { id: "nouveau_site_rectangle_selection", text: "Rectangle 3 sélectionné : .*" }
- copyTextFrom: { id: "nouveau_site_rectangle_selection" }
- swipe: { start: "50%, 39%", end: "62%, 42%", duration: 1200 }
- assertNotVisible: { id: "nouveau_site_rectangle_selection", text: "${maestro.copiedText}" }
- assertVisible: { id: "nouveau_site_rectangle_selection", text: "Rectangle 3 sélectionné : .*" }
- takeScreenshot: maestro-out/captures/v176_rectangle_etire
# Déplacer (glisser l'intérieur) : la taille du rectangle 3 ne change pas.
- copyTextFrom: { id: "nouveau_site_rectangle_selection" }
- swipe: { start: "40%, 36%", end: "40%, 33%", duration: 1200 }
- assertVisible: { id: "nouveau_site_rectangle_selection", text: "${maestro.copiedText}" }
- assertVisible: { id: "nouveau_site_rectangles", text: "Rectangles : 3, .*" }
- assertVisible: { id: "nouveau_site_rectangle_selection", text: "Rectangle 3 sélectionné : .*" }
- tapOn: { id: "nouveau_site_supprimer_rectangle" }
- assertVisible: { id: "nouveau_site_rectangles", text: "Rectangles : 2, .*" }
- assertNotVisible: { id: "nouveau_site_rectangle_selection" }
- scrollUntilVisible: { element: { id: "nouveau_site_creer" } }
- tapOn: { id: "nouveau_site_creer" }
- assertVisible: { id: "site_titre", text: "Maestro rectangles" }
- takeScreenshot: maestro-out/captures/v176_rectangle_site
