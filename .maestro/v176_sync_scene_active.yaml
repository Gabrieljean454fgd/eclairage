# v176d (D2, D5) — Accueil > Sync > Saisie (maître) sur l'émulateur, 0 esclave : « Scène active » le dit clairement,
# le top de synchro attend un esclave, et le journal horodaté est visible.
appId: app.lumisite.android
name: "v176d maître - scène active sans esclave"
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible: { id: "accueil_synchro" }
    timeout: 90000
- tapOn: { id: "accueil_synchro" }
- tapOn: { id: "synchro_mode_maitre" }
- tapOn: { text: "(?i)autoriser|allow|while using the app|lors de l'utilisation", optional: true }
- extendedWaitUntil:
    visible: { id: "synchro_mode_actif" }
    timeout: 15000
# anomalie constatée, hors périmètre, pour Devin / v176g : « 0 appareil » manquait sur synchro_resume
# sur l'appareil — le flux reste strict.
- assertVisible: { id: "synchro_resume", text: "0 appareil" }
# Défilement dans le bas de l'écran (jamais au centre : carte / caméra).
- repeat:
    while: { notVisible: { id: "synchro_scene_active" } }
    times: 12
    commands:
      - swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- assertVisible: "Scène active : aucun esclave.*"
- assertVisible: "Lancer un top de synchro \\(tous les téléphones émettent\\)"
- assertVisible: "Aucun esclave connecté.*"
- takeScreenshot: v176_sync_scene_active
# Défilement dans le bas de l'écran (jamais au centre : carte / caméra).
- repeat:
    while: { notVisible: { id: "synchro_journal" } }
    times: 12
    commands:
      - swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
- swipe: { start: "50%, 90%", end: "50%, 78%", duration: 500 }
# Journal le plus récent en haut : la ligne « rôle » est sous l'en-tête du journal, il faut encore défiler.
- scrollUntilVisible:
    element: ".*rôle : Saisie \\(maître\\)"
    direction: DOWN
# Défilement dans le bas de l'écran (jamais au centre : carte / caméra).
- repeat:
    while: { notVisible: { id: "synchro_arreter" } }
    times: 12
    commands:
      - swipe: { start: "50%, 80%", end: "50%, 92%", duration: 500 }
- swipe: { start: "50%, 80%", end: "50%, 92%", duration: 500 }
- tapOn: { id: "synchro_arreter" }
- assertVisible: { id: "synchro_mode_maitre" }
