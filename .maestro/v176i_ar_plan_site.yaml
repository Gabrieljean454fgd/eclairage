# v176i — Session > AR : surimpression des données du site (luminaires du Relevé avec leur symbole catalogue, repères de toutes
# les visites, contours du site) posée sur le sol détecté après calibrage. Sans calibrage, l'écran le dit et rien n'est dessiné.
# Le dessin dans l'image (ARCore réel, sol détecté) reste à vérifier sur téléphone.
appId: app.lumisite.android
name: "v176i AR plan du site"
---
- runFlow: scenario1_1_creer_releve.yaml
- assertVisible: { text: "Plan : affiché", childOf: { id: "session_ar_plan" } }
- assertVisible: { id: "session_ar_plan_etat", text: "Plan : calibrez pour superposer les données du site" }
- tapOn: { id: "session_ar_plan" }
- assertVisible: { text: "Plan : masqué", childOf: { id: "session_ar_plan" } }
- assertVisible: { id: "session_ar_plan_etat", text: "Plan : masqué" }
- tapOn: { id: "session_ar_plan" }
- assertVisible: { text: "Plan : affiché", childOf: { id: "session_ar_plan" } }
- takeScreenshot: maestro-out/captures/v176i_ar_plan_site
